<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPT Remoto · Operador</title>
<style>
  [hidden] { display: none !important; }
  :root { --fondo: #111317; --panel: #1b1e24; --borde: #2b2f37; --texto: #eef0f3; --tenue: #9aa2ae;
    --acento: #4f8cff; --vivo: #22c55e; --alerta: #f59e0b; --peligro: #ef4444; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; grid-template-columns: 300px 1fr 1.3fr; align-items: start; }
  h1 { grid-column: 1 / -1; margin: 0; font-size: 22px; }
  .tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 18px; }
  .tenue { color: var(--tenue); }
  .grande { font-size: 48px; font-weight: 800; letter-spacing: .2em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #qr { background: #fff; border-radius: 10px; padding: 8px; width: 100%; display: block; }
  #qr svg { width: 100%; height: auto; display: block; }
  code { font-size: 16px; background: #0006; padding: 2px 6px; border-radius: 6px; user-select: all; }
  .interruptor { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 18px; font-weight: 600; }
  .interruptor input { width: 26px; height: 26px; accent-color: var(--vivo); }
  .boton { font: inherit; font-weight: 600; color: #fff; background: var(--acento); border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer; }
  .boton.sec { background: var(--borde); }
  .boton:disabled { opacity: .4; cursor: default; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
  dt { color: var(--tenue); }
  dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .ok { color: var(--vivo); } .mal { color: var(--peligro); }

  #chat { display: flex; flex-direction: column; gap: 10px; height: calc(100vh - 110px); min-height: 420px; }
  #chat h2 { margin: 0; font-size: 18px; }
  #chat-lista { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  .burbuja { max-width: 85%; padding: 8px 12px; border-radius: 12px; background: var(--borde); white-space: pre-wrap; }
  .burbuja.mio { align-self: flex-end; background: var(--acento); color: #fff; }
  .burbuja.nuevo { outline: 2px solid var(--alerta); outline-offset: -2px; }
  .burbuja small { display: block; opacity: .7; font-size: 12px; margin-top: 2px; }
  #chat form { display: flex; gap: 8px; }
  #chat input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--borde); background: var(--fondo); color: var(--texto); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr 1fr; } #chat { grid-column: 1 / -1; height: 480px; } }
</style>
</head>
<body>
<main>
  <h1>PPT Remoto</h1>

  <section class="tarjeta" style="display:grid; gap:12px">
    <div id="qr"></div>
    <code id="url">…</code>
    <div><div class="tenue">PIN</div><div class="grande" id="pin">····</div></div>
  </section>

  <section class="tarjeta" style="display:grid; gap:18px">
    <label class="interruptor">
      <span>Control del pastor</span>
      <input type="checkbox" id="control" checked>
    </label>
    <dl>
      <dt>PowerPoint</dt><dd id="d-ppt">—</dd>
      <dt>Presentación</dt><dd id="d-deck">—</dd>
      <dt>Estado</dt><dd id="d-estado">—</dd>
      <dt>Diapositiva</dt><dd id="d-diapo">—</dd>
      <dt>Vistas previas</dt><dd id="d-previas">—</dd>
      <dt>Animaciones</dt><dd id="d-animaciones">—</dd>
      <dt>Conectados</dt><dd id="d-conectados">0</dd>
    </dl>
    <div style="display:flex; gap:10px; flex-wrap:wrap">
      <button class="boton" id="b-iniciar">Iniciar presentación</button>
      <button class="boton sec" id="b-refrescar">Actualizar vistas previas</button>
    </div>
    <p id="aviso-firewall" class="mal" hidden style="margin:0">Firewall sin permiso: las tablets pueden no conectarse. Reabrí PPT Remoto y aceptá el permiso de administrador.</p>
  </section>

  <section class="tarjeta" id="chat">
    <h2>Mensajes al pastor</h2>
    <div id="chat-lista"></div>
    <form id="chat-form"><input id="chat-input" maxlength="300" autocomplete="off" placeholder="Mensaje"><button class="boton" type="submit">Enviar</button></form>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let ws, estado = null, ultimoChat = "";

fetch("/info").then((r) => r.json()).then((i) => {
  $("pin").textContent = i.pin; $("url").textContent = i.url; $("aviso-firewall").hidden = i.firewall;
});
fetch("/qr.svg").then((r) => r.text()).then((svg) => { $("qr").innerHTML = svg; });

function conectar() {
  ws = new WebSocket(`ws://${location.host}/ws?operador=1`);
  ws.onmessage = (e) => { estado = JSON.parse(e.data); pintar(); };
  ws.onclose = () => { estado = null; pintar(); setTimeout(conectar, 1000); };
}
const enviar = (m) => ws?.readyState === 1 && ws.send(JSON.stringify(m));

function pintar() {
  const e = estado, deck = e?.deck;
  const ppt = $("d-ppt");
  ppt.textContent = !e ? "Servidor desconectado" : e.conectado ? "Conectado" : "Cerrado";
  ppt.className = e?.conectado ? "ok" : "mal";
  $("d-deck").textContent = deck ? deck.nombre : "—";
  $("d-estado").textContent = !e?.presentando ? "No está presentando" : e.fin ? "Fin de la presentación" : e.negro ? "Pantalla en negro" : "En vivo";
  $("d-diapo").textContent = e?.presentando && e.diapo ? `${e.diapo} de ${deck?.diapos.length ?? "?"}` : "—";
  $("d-previas").textContent = deck ? (deck.listas < deck.diapos.length ? `${deck.listas} de ${deck.diapos.length}` : "Listas") : "—";
  const anim = $("d-animaciones");
  anim.textContent = !deck ? "—" : deck.revisadas < deck.diapos.length ? `Preparando… ${deck.revisadas} de ${deck.diapos.length}` : "Listas";
  anim.className = deck && deck.revisadas >= deck.diapos.length ? "ok" : "";
  $("d-previas").className = deck && deck.listas >= deck.diapos.length ? "ok" : "";
  $("d-conectados").textContent = e?.conectados ?? 0;
  $("control").checked = e ? e.control_remoto : true;
  $("b-iniciar").disabled = !deck || e.presentando;
  $("b-refrescar").disabled = !deck;
  pintarChat();
}

// Sin sonido a propósito: el audio de esta laptop suele ir a los parlantes del templo.
function pintarChat() {
  const lista = estado?.mensajes ?? [];
  const sinVer = lista.filter((m) => m.de === "pastor" && !m.visto).length;
  document.title = sinVer ? `(${sinVer}) Mensaje del pastor` : "PPT Remoto · Operador";
  if (sinVer && document.visibilityState === "visible" && document.hasFocus()) setTimeout(() => enviar({ orden: "visto" }), 1500);

  const clave = JSON.stringify(lista);
  if (clave === ultimoChat) return;
  ultimoChat = clave;
  const cont = $("chat-lista");
  cont.innerHTML = "";
  for (const m of lista) {
    const b = document.createElement("div");
    b.className = "burbuja" + (m.de === "operador" ? " mio" : "") + (m.de === "pastor" && !m.visto ? " nuevo" : "");
    b.textContent = m.texto;
    const pie = document.createElement("small");
    pie.textContent = m.hora + (m.de === "operador" ? (m.visto ? " · visto ✓" : " · enviado") : " · pastor");
    b.appendChild(pie);
    cont.appendChild(b);
  }
  cont.scrollTop = cont.scrollHeight;
}

$("chat-form").onsubmit = (ev) => {
  ev.preventDefault();
  const texto = $("chat-input").value.trim();
  if (texto) { enviar({ orden: "mensaje", texto }); $("chat-input").value = ""; }
};
window.addEventListener("focus", pintarChat);

$("control").onchange = (ev) => enviar({ orden: "control_remoto", valor: ev.target.checked });
$("b-iniciar").onclick = () => enviar({ orden: "iniciar" });
$("b-refrescar").onclick = () => enviar({ orden: "refrescar" });
conectar();
</script>
</body>
</html>
